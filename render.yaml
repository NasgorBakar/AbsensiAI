services:
  - type: web
    name: absensi-ai
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: BATAS_JAM_MASUK
        value: "07:15"
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
